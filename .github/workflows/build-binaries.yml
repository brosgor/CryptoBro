name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps (Tk)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libtk8.6 tcl8.6

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller
        run: |
          pyinstaller packaging/cryptobro.spec --noconfirm --clean
          test -f dist/CryptoBro

      - name: AppImage
        env:
          ARCH: x86_64
          CI: "1"
        run: |
          chmod +x packaging/make_appimage.sh
          ./packaging/make_appimage.sh dist/CryptoBro dist/CryptoBro-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: CryptoBro-linux-AppImage
          path: dist/CryptoBro-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CryptoBro-x86_64.AppImage

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller
        run: |
          pyinstaller packaging/cryptobro.spec --noconfirm --clean
          if (-not (Test-Path dist/CryptoBro.exe)) { throw "exe missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: CryptoBro-windows-exe
          path: dist/CryptoBro.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CryptoBro.exe
